appId: com.wellness.homecoach
productName: Wellness Home Coach
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asarUnpack:
  - '**/*.node'

win:
  target: nsis

mac:
  target: dmg
  category: public.app-category.healthcare-fitness

linux:
  target:
    - AppImage
    - deb
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish: null
